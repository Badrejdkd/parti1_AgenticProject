services:
  # PostgreSQL + extension pgvector (base vectorielle principale)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maintassist-pgvector
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: maintenance
    ports:
      - "5433:5432"   # 5433 côté PC pour éviter un conflit avec un PostgreSQL déjà installé
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Qdrant (base vectorielle de comparaison)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: maintassist-qdrant
    ports:
      - "6333:6333"   # API REST + tableau de bord : http://localhost:6333/dashboard
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

# Chroma DB ne nécessite pas de conteneur : il est stocké localement dans data/chroma

volumes:
  pgdata:
  qdrantdata:
